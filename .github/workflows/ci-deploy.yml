name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gofreshshoelaundry.com
    env:
      SSH_HOST: ${{ vars.CPANEL_HOST }}
      SSH_PORT: ${{ vars.CPANEL_PORT }}
      SSH_USER: ${{ secrets.CPANEL_USER }}
      SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
      APP_PATH: ${{ vars.CPANEL_APP_PATH }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_KNOWN_HOSTS APP_PATH; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production setting: $name" >&2
              exit 1
            fi
          done

      - name: Package frontend
        shell: bash
        run: tar -czf "$RUNNER_TEMP/web-${GITHUB_SHA}.tar.gz" -C dist .

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Upload build
        shell: bash
        run: |
          scp -o PubkeyAcceptedAlgorithms=ssh-rsa \
            -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            "$RUNNER_TEMP/web-${GITHUB_SHA}.tar.gz" \
            "$SSH_USER@$SSH_HOST:web-${GITHUB_SHA}.tar.gz"

      - name: Activate build
        shell: bash
        run: |
          ssh -o PubkeyAcceptedAlgorithms=ssh-rsa \
            -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'bash -s' -- "$APP_PATH" "web-${GITHUB_SHA}.tar.gz" <<'REMOTE'
          set -euo pipefail

          deploy_root=$1
          archive=$2

          case "$deploy_root" in
            /*) ;;
            *) echo 'CPANEL_APP_PATH must be an absolute path.' >&2; exit 1 ;;
          esac

          public_dir="$deploy_root/current/public"
          if [[ ! -f "$public_dir/index.php" || ! -f "$public_dir/.htaccess" ]]; then
            echo 'Deploy the API once before deploying the frontend.' >&2
            exit 1
          fi

          exec 9>"$deploy_root/.deploy.lock"
          if command -v flock >/dev/null 2>&1; then
            flock -w 180 9
          fi

          staging=$(mktemp -d "$deploy_root/web.XXXXXX")
          trap 'rm -rf "$staging"; rm -f "$HOME/$archive"' EXIT
          tar -xzf "$HOME/$archive" -C "$staging"

          manifest="$deploy_root/shared/frontend-files.txt"
          if [[ -f "$manifest" ]]; then
            while IFS= read -r relative; do
              case "$relative" in
                ''|/*|*..*|index.php|.htaccess|storage|storage/*) continue ;;
              esac
              rm -f "$public_dir/$relative"
            done < "$manifest"
          fi

          cp -a "$staging/." "$public_dir/"
          find "$staging" -type f -printf '%P\n' | sort > "$manifest"
          REMOTE

      - name: Verify production
        shell: bash
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://gofreshshoelaundry.com/
